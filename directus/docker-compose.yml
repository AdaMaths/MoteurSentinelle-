services:
  directus_db:
    image: postgres:15-alpine
    container_name: moteursentinelle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DIRECTUS_DB_USER:?Set DIRECTUS_DB_USER in .env.directus}
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:?Set DIRECTUS_DB_PASSWORD in .env.directus}
      POSTGRES_DB: ${DIRECTUS_DB_DATABASE:?Set DIRECTUS_DB_DATABASE in .env.directus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moteursentinelle_net

  directus:
    image: directus/directus:10.10.4
    container_name: moteursentinelle_directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY in .env.directus}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env.directus}
      DB_CLIENT: "pg"
      DB_HOST: "directus_db"
      DB_PORT: "5432"
      DB_DATABASE: ${DIRECTUS_DB_DATABASE:?Set DIRECTUS_DB_DATABASE in .env.directus}
      DB_USER: ${DIRECTUS_DB_USER:?Set DIRECTUS_DB_USER in .env.directus}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?Set DIRECTUS_DB_PASSWORD in .env.directus}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in .env.directus}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env.directus}
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "./uploads"
    volumes:
      - ./uploads:/directus/uploads
    depends_on:
      - directus_db
    networks:
      - moteursentinelle_net

volumes:
  postgres_data:

networks:
  moteursentinelle_net:
